# Netlify: hosts the static demo of WETCOR AI (the pre-computed Showcase only).
# The frontend is exported to plain HTML/CSS/JS (frontend/out); no Netlify Next.js runtime is needed.
# The Python backend cannot run on Netlify; the full app runs locally (see README.md).
# A copy of this file lives in frontend/netlify.toml for the case where Netlify's base directory is set to "frontend".

[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Hosted static-demo mode. (Also switched on automatically whenever NETLIFY=true.)
  NEXT_PUBLIC_STATIC_DEMO = "1"
